[project]
name = "mock-drone-api-testing"
version = "1.1.0"
description = "FastAPI mock drone-telemetry service used as a target for API test automation"
requires-python = ">=3.11"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=app --cov=utils --cov=tools --cov-report=term-missing --cov-fail-under=90 -ra"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PT", "RUF"]
