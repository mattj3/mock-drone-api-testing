name: Drone API Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest --junitxml=test-results.xml --cov-report=xml
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test the image
        run: |
          docker build -t mock-drone-api .
          docker run -d --name api -p 8000:8000 mock-drone-api
          for i in $(seq 1 20); do curl -fsS http://localhost:8000/openapi.json >/dev/null && break; sleep 1; done
          curl -fsS -X POST http://localhost:8000/telemetry -H 'Content-Type: application/json' \
            -d '{"lat":30.27,"lon":-97.74,"alt":120,"speed":12,"heading":90}'
          docker logs api
